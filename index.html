<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>提示詞換名小工具</title>
<style>
  :root {
    --bg: #f6f7f9;
    --card: #ffffff;
    --text: #1d1f23;
    --muted: #666b74;
    --border: #d9dce1;
    --input-bg: #ffffff;
    --accent: #2f6fde;
    --accent-text: #ffffff;
    --danger: #c93a3a;
    --male-bg: #d6e6ff;
    --male-text: #0d3b8c;
    --female-bg: #ffdbe7;
    --female-text: #8a1640;
    --toast-bg: #1d1f23;
    --toast-text: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121417;
      --card: #1c1f24;
      --text: #e7e9ec;
      --muted: #9aa0a9;
      --border: #343941;
      --input-bg: #15181c;
      --accent: #5b92f0;
      --accent-text: #0b1020;
      --danger: #f07171;
      --male-bg: #1f3a66;
      --male-text: #cfe0ff;
      --female-bg: #5c2338;
      --female-text: #ffd6e4;
      --toast-bg: #e7e9ec;
      --toast-text: #121417;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    font-size: 16px;
    line-height: 1.5;
  }
  main { max-width: 760px; margin: 0 auto; padding: 16px 16px 48px; }
  h1 { font-size: 1.35rem; margin: 4px 0 16px; }
  h2 { font-size: 1.05rem; margin: 0 0 12px; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 16px;
  }
  label { display: block; font-size: .9rem; color: var(--muted); margin: 12px 0 4px; }
  label:first-child { margin-top: 0; }
  input[type="text"], select, textarea {
    width: 100%;
    font: inherit;
    font-size: 16px; /* 避免 iOS 自動放大 */
    color: var(--text);
    background: var(--input-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    min-height: 44px;
  }
  textarea { min-height: 160px; resize: vertical; }
  input:focus, select:focus, textarea:focus, button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .row > * { flex: 1 1 auto; }
  .grid2 { display: grid; grid-template-columns: 1fr; gap: 0 12px; }
  @media (min-width: 560px) { .grid2 { grid-template-columns: 1fr 1fr; } }
  button {
    font: inherit;
    font-size: 15px;
    min-height: 44px;
    padding: 8px 14px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    cursor: pointer;
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); font-weight: 600; }
  button.danger { color: var(--danger); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  .actions { margin-top: 12px; }
  .switch { display: flex; align-items: center; gap: 10px; margin-top: 14px; color: var(--text); font-size: .95rem; }
  .switch input { width: 22px; height: 22px; margin: 0; accent-color: var(--accent); }
  .hint { font-size: .85rem; color: var(--muted); margin: 6px 0 0; }
  .output {
    white-space: pre-wrap;
    word-break: break-word;
    background: var(--input-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px;
    min-height: 120px;
    font-size: 15px;
  }
  .output .empty { color: var(--muted); }
  mark { border-radius: 3px; padding: 0 2px; }
  mark.m { background: var(--male-bg); color: var(--male-text); }
  mark.f { background: var(--female-bg); color: var(--female-text); }
  .legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: .85rem; color: var(--muted); margin-bottom: 8px; }
  .stat { font-size: .85rem; color: var(--muted); margin-top: 8px; }
  details > summary { cursor: pointer; font-weight: 600; min-height: 32px; list-style-position: inside; }
  details[open] > summary { margin-bottom: 8px; }
  .empty-state { text-align: center; color: var(--muted); padding: 8px 0; }
  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px);
    background: var(--toast-bg); color: var(--toast-text);
    padding: 10px 18px; border-radius: 999px; font-size: .95rem;
    opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s;
    max-width: calc(100% - 32px);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .hidden { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>提示詞換名小工具</h1>

  <!-- 模板選擇 -->
  <section class="card">
    <h2>模板</h2>
    <div id="pickerWrap">
      <label for="tplSelect">選擇模板</label>
      <select id="tplSelect"></select>
    </div>
    <p id="noTpl" class="empty-state hidden">目前還沒有模板，按「新增模板」開始吧。</p>
    <div class="row actions">
      <button id="btnNew" class="primary" type="button">新增模板</button>
      <button id="btnDelete" class="danger" type="button">刪除此模板</button>
    </div>
    <div class="row actions">
      <button id="btnExport" type="button">匯出 JSON</button>
      <button id="btnImport" type="button">匯入 JSON</button>
      <input id="fileImport" type="file" accept="application/json,.json" class="hidden">
    </div>
  </section>

  <!-- 模板內容編輯 -->
  <section class="card" id="editorCard">
    <details id="editorDetails" open>
      <summary>編輯模板內容</summary>
      <label for="tplName">模板名稱</label>
      <input id="tplName" type="text" placeholder="例如：咖啡廳約會" autocomplete="off">
      <div class="grid2">
        <div>
          <label for="tplMale">原本的男生名字</label>
          <input id="tplMale" type="text" placeholder="例如：Tom" autocomplete="off" autocapitalize="off" spellcheck="false">
        </div>
        <div>
          <label for="tplFemale">原本的女生名字</label>
          <input id="tplFemale" type="text" placeholder="例如：Ann" autocomplete="off" autocapitalize="off" spellcheck="false">
        </div>
      </div>
      <label for="tplPrompt">原始 prompt（og prompt）</label>
      <textarea id="tplPrompt" placeholder="把原始 prompt 貼在這裡"></textarea>
      <p class="hint">修改會自動儲存在這個瀏覽器裡。</p>
    </details>
  </section>

  <!-- 替換區 -->
  <section class="card" id="swapCard">
    <h2>換成新名字</h2>
    <div class="grid2">
      <div>
        <label for="newMale">新的男生名字</label>
        <input id="newMale" type="text" placeholder="留空＝不換" autocomplete="off" autocapitalize="off" spellcheck="false">
      </div>
      <div>
        <label for="newFemale">新的女生名字</label>
        <input id="newFemale" type="text" placeholder="留空＝不換" autocomplete="off" autocapitalize="off" spellcheck="false">
      </div>
    </div>
    <label class="switch"><input id="wholeWord" type="checkbox" checked> 整字比對（避免 Ann 換到 Anna）</label>
    <p class="hint">區分大小寫。</p>
  </section>

  <!-- 結果 -->
  <section class="card" id="resultCard">
    <h2>結果</h2>
    <div class="legend">
      <span><mark class="m">男生名字</mark></span>
      <span><mark class="f">女生名字</mark></span>
    </div>
    <div id="output" class="output" aria-live="polite"></div>
    <p id="stat" class="stat"></p>
    <div class="row actions">
      <button id="btnCopy" class="primary" type="button">複製結果</button>
      <button id="btnCopyOg" type="button">複製原始 prompt</button>
    </div>
  </section>
</main>

<div id="toast" class="toast" role="status"></div>

<script>
(function () {
  'use strict';

  var STORE_KEY = 'promptNameSwap.v1';

  // ---------- 儲存 ----------
  function defaultState() {
    return { templates: [], currentId: null, newMale: '', newFemale: '', wholeWord: true };
  }

  function sanitizeTemplate(t) {
    if (!t || typeof t !== 'object') return null;
    return {
      id: typeof t.id === 'string' && t.id ? t.id : makeId(),
      name: String(t.name == null ? '' : t.name),
      prompt: String(t.prompt == null ? '' : t.prompt),
      male: String(t.male == null ? '' : t.male),
      female: String(t.female == null ? '' : t.female)
    };
  }

  function loadState() {
    var s = defaultState();
    try {
      var raw = localStorage.getItem(STORE_KEY);
      if (!raw) return s;
      var data = JSON.parse(raw);
      if (data && typeof data === 'object') {
        if (Array.isArray(data.templates)) {
          s.templates = data.templates.map(sanitizeTemplate).filter(Boolean);
        }
        if (typeof data.currentId === 'string') s.currentId = data.currentId;
        if (typeof data.newMale === 'string') s.newMale = data.newMale;
        if (typeof data.newFemale === 'string') s.newFemale = data.newFemale;
        if (typeof data.wholeWord === 'boolean') s.wholeWord = data.wholeWord;
      }
    } catch (e) { /* 資料損毀或無法存取時使用預設值 */ }
    return s;
  }

  var saveTimer = null;
  function saveNow() {
    clearTimeout(saveTimer);
    try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) { /* 無法儲存時略過 */ }
  }
  function saveSoon() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(saveNow, 250);
  }
  window.addEventListener('pagehide', saveNow);

  function makeId() {
    return 't' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }

  var state = loadState();

  // ---------- DOM ----------
  function $(id) { return document.getElementById(id); }
  var el = {
    select: $('tplSelect'), pickerWrap: $('pickerWrap'), noTpl: $('noTpl'),
    btnNew: $('btnNew'), btnDelete: $('btnDelete'), btnExport: $('btnExport'),
    btnImport: $('btnImport'), fileImport: $('fileImport'),
    editorCard: $('editorCard'), swapCard: $('swapCard'), resultCard: $('resultCard'),
    name: $('tplName'), male: $('tplMale'), female: $('tplFemale'), prompt: $('tplPrompt'),
    newMale: $('newMale'), newFemale: $('newFemale'), wholeWord: $('wholeWord'),
    output: $('output'), stat: $('stat'), btnCopy: $('btnCopy'), btnCopyOg: $('btnCopyOg'),
    toast: $('toast')
  };

  function current() {
    for (var i = 0; i < state.templates.length; i++) {
      if (state.templates[i].id === state.currentId) return state.templates[i];
    }
    return null;
  }

  // ---------- 替換邏輯 ----------
  function escapeRegExp(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }

  // 整字比對：前後不能緊接拉丁字母、數字或底線。
  // 中文等非拉丁字元不算「字的一部分」，所以中文名字也能正常替換。
  var WORD_CHAR = '[\\p{Script=Latin}\\p{N}_]';

  // 回傳 [{text, type}]，type 為 null / 'm' / 'f'
  function buildSegments(text, rules, wholeWord) {
    rules = rules.filter(function (r) { return r.from && r.to; });
    if (!text || !rules.length) return { segments: [{ text: text, type: null }], count: { m: 0, f: 0 } };

    // 長名字優先，避免一個名字是另一個名字的前綴時出錯；一次掃描完成，不會連鎖替換
    rules.sort(function (a, b) { return b.from.length - a.from.length; });
    var body = rules.map(function (r) { return escapeRegExp(r.from); }).join('|');
    var pattern = wholeWord
      ? '(?<!' + WORD_CHAR + ')(?:' + body + ')(?!' + WORD_CHAR + ')'
      : '(?:' + body + ')';
    var re = new RegExp(pattern, 'gu');

    var map = {};
    rules.forEach(function (r) { if (!(r.from in map)) map[r.from] = r; });

    var segs = [], last = 0, m, count = { m: 0, f: 0 };
    while ((m = re.exec(text)) !== null) {
      if (m[0] === '') { re.lastIndex++; continue; }
      if (m.index > last) segs.push({ text: text.slice(last, m.index), type: null });
      var r = map[m[0]];
      segs.push({ text: r.to, type: r.type });
      count[r.type]++;
      last = m.index + m[0].length;
    }
    if (last < text.length) segs.push({ text: text.slice(last), type: null });
    return { segments: segs, count: count };
  }

  var lastResultText = '';

  function renderOutput() {
    var t = current();
    el.output.textContent = '';
    if (!t || !t.prompt) {
      lastResultText = '';
      var span = document.createElement('span');
      span.className = 'empty';
      span.textContent = '請先在模板裡貼上原始 prompt。';
      el.output.appendChild(span);
      el.stat.textContent = '';
      return;
    }
    var res = buildSegments(t.prompt, [
      { from: t.male.trim(), to: el.newMale.value.trim(), type: 'm' },
      { from: t.female.trim(), to: el.newFemale.value.trim(), type: 'f' }
    ], el.wholeWord.checked);

    var frag = document.createDocumentFragment();
    res.segments.forEach(function (s) {
      if (s.type) {
        var mk = document.createElement('mark');
        mk.className = s.type;
        mk.textContent = s.text;
        frag.appendChild(mk);
      } else {
        frag.appendChild(document.createTextNode(s.text));
      }
    });
    el.output.appendChild(frag);
    lastResultText = res.segments.map(function (s) { return s.text; }).join('');

    var parts = [];
    if (el.newMale.value.trim() && t.male.trim()) parts.push('男生名字換了 ' + res.count.m + ' 處');
    if (el.newFemale.value.trim() && t.female.trim()) parts.push('女生名字換了 ' + res.count.f + ' 處');
    el.stat.textContent = parts.length ? parts.join('，') : '尚未輸入新名字，目前顯示原始內容。';
  }

  // ---------- 畫面更新 ----------
  function renderSelect() {
    el.select.textContent = '';
    state.templates.forEach(function (t, i) {
      var o = document.createElement('option');
      o.value = t.id;
      o.textContent = t.name.trim() || ('未命名模板 ' + (i + 1));
      el.select.appendChild(o);
    });
    if (state.currentId) el.select.value = state.currentId;
  }

  function renderAll() {
    if (!current() && state.templates.length) state.currentId = state.templates[0].id;
    var has = state.templates.length > 0;
    el.pickerWrap.classList.toggle('hidden', !has);
    el.noTpl.classList.toggle('hidden', has);
    el.editorCard.classList.toggle('hidden', !has);
    el.swapCard.classList.toggle('hidden', !has);
    el.resultCard.classList.toggle('hidden', !has);
    el.btnDelete.disabled = !has;
    el.btnExport.disabled = !has;
    renderSelect();

    var t = current();
    el.name.value = t ? t.name : '';
    el.male.value = t ? t.male : '';
    el.female.value = t ? t.female : '';
    el.prompt.value = t ? t.prompt : '';
    renderOutput();
  }

  // ---------- 事件 ----------
  el.select.addEventListener('change', function () {
    state.currentId = el.select.value;
    saveNow();
    renderAll();
  });

  el.btnNew.addEventListener('click', function () {
    var t = { id: makeId(), name: '新模板', prompt: '', male: '', female: '' };
    state.templates.push(t);
    state.currentId = t.id;
    saveNow();
    renderAll();
    el.editorDetails = el.editorDetails || $('editorDetails');
    el.editorDetails.open = true;
    el.name.focus();
    el.name.select();
  });

  el.btnDelete.addEventListener('click', function () {
    var t = current();
    if (!t) return;
    if (!confirm('確定要刪除「' + (t.name.trim() || '未命名模板') + '」嗎？此動作無法復原。')) return;
    var idx = state.templates.indexOf(t);
    state.templates.splice(idx, 1);
    var next = state.templates[idx] || state.templates[idx - 1];
    state.currentId = next ? next.id : null;
    saveNow();
    renderAll();
    toast('已刪除模板');
  });

  function bindField(input, key) {
    input.addEventListener('input', function () {
      var t = current();
      if (!t) return;
      t[key] = input.value;
      if (key === 'name') renderSelect();
      renderOutput();
      saveSoon();
    });
  }
  bindField(el.name, 'name');
  bindField(el.male, 'male');
  bindField(el.female, 'female');
  bindField(el.prompt, 'prompt');

  el.newMale.addEventListener('input', function () { state.newMale = el.newMale.value; renderOutput(); saveSoon(); });
  el.newFemale.addEventListener('input', function () { state.newFemale = el.newFemale.value; renderOutput(); saveSoon(); });
  el.wholeWord.addEventListener('change', function () { state.wholeWord = el.wholeWord.checked; renderOutput(); saveNow(); });

  // ---------- 複製 ----------
  function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) {
      return navigator.clipboard.writeText(text).catch(function () { return fallbackCopy(text); });
    }
    return fallbackCopy(text);
  }
  function fallbackCopy(text) {
    return new Promise(function (resolve, reject) {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly', '');
      ta.style.position = 'fixed';
      ta.style.top = '-1000px';
      document.body.appendChild(ta);
      ta.select();
      ta.setSelectionRange(0, text.length);
      var ok = false;
      try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
      document.body.removeChild(ta);
      ok ? resolve() : reject(new Error('copy failed'));
    });
  }

  el.btnCopy.addEventListener('click', function () {
    if (!lastResultText) { toast('沒有可複製的內容'); return; }
    copyText(lastResultText).then(function () { toast('已複製結果'); }, function () { toast('複製失敗，請手動選取'); });
  });
  el.btnCopyOg.addEventListener('click', function () {
    var t = current();
    if (!t || !t.prompt) { toast('沒有可複製的內容'); return; }
    copyText(t.prompt).then(function () { toast('已複製原始 prompt'); }, function () { toast('複製失敗，請手動選取'); });
  });

  // ---------- 匯出／匯入 ----------
  el.btnExport.addEventListener('click', function () {
    var data = {
      app: 'prompt-name-swap',
      version: 1,
      exportedAt: new Date().toISOString(),
      templates: state.templates
    };
    var blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    var d = new Date();
    var pad = function (n) { return String(n).padStart(2, '0'); };
    a.href = url;
    a.download = 'prompt-templates-' + d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) + '.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
    toast('已匯出 ' + state.templates.length + ' 組模板');
  });

  el.btnImport.addEventListener('click', function () { el.fileImport.click(); });
  el.fileImport.addEventListener('change', function () {
    var file = el.fileImport.files && el.fileImport.files[0];
    el.fileImport.value = '';
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function () {
      var list;
      try {
        var data = JSON.parse(String(reader.result));
        list = Array.isArray(data) ? data : (data && Array.isArray(data.templates) ? data.templates : null);
      } catch (e) { list = null; }
      if (!list) { toast('檔案格式不正確'); return; }
      var incoming = list.map(sanitizeTemplate).filter(Boolean);
      if (!incoming.length) { toast('檔案裡沒有模板'); return; }

      // 同 id 的覆蓋，其餘新增
      var added = 0, updated = 0;
      incoming.forEach(function (t) {
        var idx = -1;
        for (var i = 0; i < state.templates.length; i++) if (state.templates[i].id === t.id) { idx = i; break; }
        if (idx >= 0) { state.templates[idx] = t; updated++; } else { state.templates.push(t); added++; }
      });
      if (!current()) state.currentId = incoming[0].id;
      saveNow();
      renderAll();
      toast('匯入完成：新增 ' + added + ' 組，更新 ' + updated + ' 組');
    };
    reader.onerror = function () { toast('讀取檔案失敗'); };
    reader.readAsText(file);
  });

  // ---------- 提示 ----------
  var toastTimer = null;
  function toast(msg) {
    el.toast.textContent = msg;
    el.toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.toast.classList.remove('show'); }, 1600);
  }

  // ---------- 初始化 ----------
  el.newMale.value = state.newMale;
  el.newFemale.value = state.newFemale;
  el.wholeWord.checked = state.wholeWord;
  el.editorDetails = $('editorDetails');
  renderAll();
})();
</script>
</body>
</html>
